name: voca-ios
options:
  bundleIdPrefix: com.grobiann
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    DEVELOPMENT_TEAM: ''
targets:
  VocaCore:
    type: framework
    platform: iOS
    sources: [Sources/VocaCore]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  voca-ios:
    type: application
    platform: iOS
    sources: [VocaApp]
    dependencies:
      - target: VocaCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.grobiann.voca-ios
        INFOPLIST_KEY_CFBundleDisplayName: voca-ios
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: '1,2'
        MARKETING_VERSION: '1.0'
        CURRENT_PROJECT_VERSION: '1'
  VocaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: voca-ios
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: voca-ios
schemes:
  voca-ios:
    build:
      targets:
        voca-ios: all
    test:
      targets: [VocaUITests]
